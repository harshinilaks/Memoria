name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memoria
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria -d memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://memoria:memoria_password@localhost:5432/memoria
      TEST_DATABASE_URL: postgresql+psycopg://memoria:memoria_password@localhost:5432/memoria_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest
